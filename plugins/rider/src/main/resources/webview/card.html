<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Agent Card</title>
    <link rel="stylesheet" href="css/mtg-card.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        .card-actions {
            margin-top: 16px;
            display: flex;
            gap: 10px;
        }
        .action-btn {
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
            color: #e2e8f0;
            border: 1px solid #4a5568;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .action-btn:hover {
            background: linear-gradient(135deg, #5a6578 0%, #3d4758 100%);
            border-color: #718096;
        }
        .action-btn:active {
            transform: scale(0.98);
        }
        .action-btn.success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            border-color: #48bb78;
        }
        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <!-- Card will be rendered here by JavaScript -->
    <div id="card-container"></div>

    <!-- Action buttons -->
    <div class="card-actions">
        <button id="save-avatar-btn" class="action-btn" onclick="saveAvatar()">
            💾 Save Avatar
        </button>
    </div>

    <script src="js/card-engine.js"></script>
    <script>
        // Initialize card engine
        const cardEngine = new MtgCardEngine();

        // Store current card data for avatar saving
        let currentCardData = null;
        let currentArtPath = null;

        // Override renderCard to target container and store data
        window.renderCard = function(cardData, artPath) {
            currentCardData = cardData;
            currentArtPath = artPath || null;
            cardEngine.renderCard(cardData, '#card-container');
        };

        // Save avatar function - sends message to Java
        window.saveAvatar = function() {
            const btn = document.getElementById('save-avatar-btn');
            if (!currentCardData) {
                alert('No card data available');
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Saving...';

            // Send message to JCEF bridge
            if (window.cefQuery) {
                window.cefQuery({
                    request: JSON.stringify({
                        action: 'saveAvatar',
                        cardName: currentCardData.name,
                        sourceFile: currentCardData.sourceFile,
                        artPath: currentArtPath
                    }),
                    onSuccess: function(response) {
                        btn.textContent = '✓ Saved!';
                        btn.classList.add('success');
                        setTimeout(() => {
                            btn.textContent = '💾 Save Avatar';
                            btn.classList.remove('success');
                            btn.disabled = false;
                        }, 2000);
                    },
                    onFailure: function(errorCode, errorMessage) {
                        btn.textContent = '❌ Failed';
                        alert('Failed to save avatar: ' + errorMessage);
                        setTimeout(() => {
                            btn.textContent = '💾 Save Avatar';
                            btn.disabled = false;
                        }, 2000);
                    }
                });
            } else {
                // Fallback for non-JCEF environments (dev testing)
                console.log('Save avatar requested:', currentCardData.name);
                btn.textContent = '💾 Save Avatar';
                btn.disabled = false;
                alert('Save avatar only works in the IDE plugin');
            }
        };

        // Example card for testing (will be replaced by plugin data)
        const exampleCard = {
            name: "Research Agent",
            manaCost: "{2}{U}{U}",
            colorIdentity: ["BLUE"],
            typeLine: "Legendary Creature — AI Agent LangChain",
            artUrl: null,
            abilities: [
                { name: "Web Search", description: "Search the web for information", abilityType: "ACTIVATED" },
                { name: "Analyze Data", description: "Process and analyze retrieved data", abilityType: "ACTIVATED" },
                { name: "Generate Report", description: "Create comprehensive reports", abilityType: "ACTIVATED" }
            ],
            flavorText: "You are a research agent. Your goal is to find accurate information and synthesize it into useful insights.",
            power: 3,
            toughness: 1,
            setSymbol: "MTG-AGENTS",
            collectorInfo: "gpt-4o",
            frameType: "CREATURE",
            sourceFile: "/src/agents/research.ts",
            sourceLineNumber: 42
        };

        // Render example card if no data is injected
        setTimeout(() => {
            const container = document.getElementById('card-container');
            if (container && !container.hasChildNodes()) {
                window.renderCard(exampleCard);
            }
        }, 100);
    </script>
</body>
</html>
